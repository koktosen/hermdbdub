<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hermdbw</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">
<!-- Weather icons as inline SVG: emoji glyphs depend on whichever font a browser has, these do not. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="wx-clear-day" viewBox="0 0 64 64"><circle cx="32" cy="32" r="12" fill="#f7c948"/><path d="M32 6v9M32 49v9M6 32h9M49 32h9M13.6 13.6l6.4 6.4M44 44l6.4 6.4M13.6 50.4l6.4-6.4M44 20l6.4-6.4" stroke="#f7c948" stroke-width="4.5" stroke-linecap="round" fill="none"/></symbol>
<symbol id="wx-clear-night" viewBox="0 0 64 64"><path fill="#e9e4c8" d="M38 6a24 24 0 1 0 20 38A22 22 0 0 1 38 6z"/></symbol>
<symbol id="wx-partly-day" viewBox="0 0 64 64"><circle cx="22" cy="20" r="9" fill="#f7c948"/><path d="M22 3v6M22 31v3M5 20h6M33 20h6M10 8l4 4M30 8l-4 4M10 32l4-4" stroke="#f7c948" stroke-width="4" stroke-linecap="round" fill="none"/><path fill="#d3dae6" transform="translate(6 10) scale(2.4)" d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></symbol>
<symbol id="wx-partly-night" viewBox="0 0 64 64"><path fill="#e9e4c8" transform="translate(8 2) scale(.55)" d="M38 6a24 24 0 1 0 20 38A22 22 0 0 1 38 6z"/><path fill="#d3dae6" transform="translate(6 10) scale(2.4)" d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></symbol>
<symbol id="wx-overcast" viewBox="0 0 64 64"><path fill="#9aa6b8" transform="translate(10 0) scale(2.2)" d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/><path fill="#d3dae6" transform="translate(0 12) scale(2.4)" d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></symbol>
<symbol id="wx-fog" viewBox="0 0 64 64"><path fill="#d3dae6" transform="translate(2 -2) scale(2.3)" d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/><path d="M12 50h40M18 58h28" stroke="#b9c3d2" stroke-width="4" stroke-linecap="round" fill="none"/></symbol>
<symbol id="wx-drizzle" viewBox="0 0 64 64"><path fill="#d3dae6" transform="translate(2 -4) scale(2.3)" d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/><path d="M22 48l-2 6M32 48l-2 6M42 48l-2 6" stroke="#6fb1ff" stroke-width="4" stroke-linecap="round" fill="none"/></symbol>
<symbol id="wx-rain" viewBox="0 0 64 64"><path fill="#d3dae6" transform="translate(2 -4) scale(2.3)" d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/><path d="M22 46l-4 12M33 46l-4 12M44 46l-4 12" stroke="#6fb1ff" stroke-width="4" stroke-linecap="round" fill="none"/></symbol>
<symbol id="wx-snow" viewBox="0 0 64 64"><path fill="#d3dae6" transform="translate(2 -4) scale(2.3)" d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/><g fill="#e6f4ff"><circle cx="22" cy="50" r="3"/><circle cx="32" cy="57" r="3"/><circle cx="42" cy="50" r="3"/></g></symbol>
<symbol id="wx-storm" viewBox="0 0 64 64"><path fill="#9aa6b8" transform="translate(2 -6) scale(2.3)" d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/><path fill="#ffd34d" d="M35 36l-10 14h7l-3 11 11-15h-7z"/></symbol>
<symbol id="wx-unknown" viewBox="0 0 64 64"><circle cx="32" cy="32" r="21" fill="none" stroke="#9aa6b8" stroke-width="4"/><circle cx="32" cy="32" r="4" fill="#9aa6b8"/></symbol>
</defs></svg>
<header id="topbar">
  <div id="clock"><span id="time">--:--</span><span id="date">loading</span><span id="fresh" class="fresh"><i></i><span>updating…</span></span></div>
  <div id="weather-strip" class="muted">weather: not configured</div>
  <div id="moon" class="moon"></div>
  <nav id="tabs"></nav>
</header>

<main id="stage">
  <section id="page-calendar" class="page">
    <div class="col-left">
      <div id="next-up" class="card hero"></div>
      <div id="major-strip" class="major-strip"></div>
      <h2>Today</h2>
      <div id="today-list" class="agenda"><div id="today-inner" class="scroller"></div></div>
    </div>
    <div class="col-right">
      <div id="week-grid" class="week"></div>
    </div>
  </section>

  <section id="page-feed" class="page">
    <div id="ticker-crypto" class="ticker"></div>
    <div id="ticker-stocks" class="ticker"></div>
    <div class="feed-cols">
      <div class="card feed-col" data-col="headlines"><h2>Headlines</h2><div class="scroll"><div id="headlines" class="scroller"></div></div></div>
      <div class="card feed-col" data-col="xtrends"><div class="card-head"><h2>Trending on X</h2><span id="x-stamp" class="muted"></span></div><div class="scroll"><div id="xtrends" class="scroller xtrends"></div></div></div>
      <div class="card feed-col" data-col="xme"><div class="card-head"><h2 id="xme-title">X · you</h2><span id="xme-stamp" class="muted"></span></div><div class="scroll"><div id="xme" class="scroller"></div></div></div>
      <div class="card feed-col sadie" data-col="brief"><div class="card-head"><h2 id="brief-title">Brief</h2><span id="brief-stamp" class="muted"></span></div><div class="scroll"><div id="brief-body" class="scroller brief-body"></div></div></div>
    </div>
  </section>

  <section id="page-weather" class="page">
    <div class="wx-now card glass" id="wx-now">
      <div class="wx-big"><span id="wx-icon"></span><span id="wx-temp"></span></div>
      <div id="wx-label" class="wx-label"></div>
      <div id="wx-meta" class="wx-meta muted"></div>
    </div>
    <div class="card wx-hourly"><h2>Next 24 hours <small>line = temperature · bars = chance of rain</small></h2><div id="wx-chart"></div></div>
    <div id="wx-days" class="wx-days"></div>
  </section>

</main>

<div id="dock">
  <div id="bottom-strip" class="bottom-strip"></div>
  <div class="marquee" id="mq-ticker"><div class="mq-track"></div></div>
  <div class="marquee" id="mq-news"><div class="mq-track"></div></div>
  <div id="alert-bar" class="alert-bar" hidden></div>
</div>
<div id="alert-flash" class="alert-flash" hidden>
  <img id="af-img" alt="" hidden>
  <div class="af-text"><div id="af-level" class="af-level"></div><div id="af-title" class="af-title"></div><div id="af-body" class="af-body"></div><div class="muted af-hint">Enter / 0 to dismiss</div></div>
</div>
<div id="takeover" class="takeover" hidden>
  <div class="tk-head"><span id="tk-greeting">Good morning</span><span id="tk-date" class="muted"></span></div>
  <div class="tk-scroll"><div id="tk-body" class="tk-body"></div></div>
  <div class="tk-foot muted">press 0 / Enter to dismiss</div>
  <audio id="tk-audio" preload="auto"></audio>
</div>
<footer id="status" class="muted"></footer>
<script src="app.js"></script>
</body>
</html>
